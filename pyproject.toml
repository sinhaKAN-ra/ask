[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aolbeam-ask"
version = "0.1.0"
description = "A lightweight, stateless terminal AI CLI that knows when to search the web. Command: ask"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Karan Sinha", email = "nomore.report@gmail.com" }]
keywords = ["cli", "llm", "ai", "terminal", "assistant", "groq", "web-search", "openai", "ollama"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Topic :: Utilities",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Zero runtime dependencies — stdlib only (urllib, json). This is deliberate:
# the tool stays a single-file, zero-idle-memory process with nothing to install
# beyond Python itself.
dependencies = []

[project.urls]
Homepage = "https://ask.aolbeam.com"
Repository = "https://github.com/sinhaKAN-ra/ask"
Issues = "https://github.com/sinhaKAN-ra/ask/issues"

[project.scripts]
# The published package is `aolbeam-ask`, but the command users type is `ask`.
ask = "aolbeam_ask:main"

[tool.hatch.build.targets.wheel]
packages = ["src/aolbeam_ask"]

[tool.hatch.build.targets.sdist]
include = ["src/aolbeam_ask", "README.md", "LICENSE"]
